<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | เที่ยวบ้านเรา</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #EAF6FF;
            color: #29485E;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #A7D8F5;
            color: #23445A;
            padding: 16px;
        }

        .site-name {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0 25px;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            padding: 0;
            margin: 0 15px 15px;
        }

        nav a {
            color: #23445A;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        nav a:hover {
            color: white;
        }

        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            background-color: #FFFFFF;
            border: 1px solid #C5E5F8;
            border-radius: 16px;
            padding: 35px 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 12px rgba(35, 68, 90, 0.06);
        }

        .login-card h1 {
            font-size: 28px;
            color: #245577;
            text-align: center;
            margin: 0 0 8px;
        }

        .login-card .subtitle {
            font-size: 15px;
            color: #4A687D;
            text-align: center;
            margin: 0 0 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            color: #23445A;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #C5E5F8;
            border-radius: 8px;
            font-size: 15px;
            color: #29485E;
            background-color: #FFFFFF;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #69B5E2;
        }

        .password-wrapper {
            display: flex;
            gap: 10px;
        }

        .password-wrapper input {
            flex-grow: 1;
        }

        .toggle-btn {
            background-color: #23445A;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .toggle-btn:hover {
            background-color: #356382;
        }

        .submit-btn {
            width: 100%;
            background-color: #23445A;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background-color: #356382;
        }

        .demo-box {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #E1F2FC;
            font-size: 13px;
            color: #4A687D;
            line-height: 1.6;
        }

        .demo-box strong {
            color: #23445A;
        }

        footer {
            background-color: #A7D8F5;
            color: #23445A;
            padding: 30px 16px;
            font-size: 18px;
            text-align: center;
        }

        @media (max-width: 650px) {
            nav ul {
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <p class="site-name">เที่ยวบ้านเรา 🌤️</p>

        <nav aria-label="เมนูหลัก">
            <ul>
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="places.html">ที่เที่ยว</a></li>
                <li><a href="food.html">อาหาร</a></li>
                <li><a href="plan.html">วางแผนเที่ยว</a></li>
                <li><a href="travel.html">ข้อมูลการเดินทาง</a></li>
                <li><a href="login.html">เข้าสู่ระบบ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="login-card">
            <h1>เข้าสู่ระบบ</h1>
            <p class="subtitle">ยินดีต้อนรับสู่เว็บไซต์เที่ยวบ้านเรา</p>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้</label>
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
                        <button type="button" class="toggle-btn" onclick="togglePassword()">แสดง</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="role">ประเภทผู้ใช้งาน</label>
                    <select id="role">
                        <option value="user">สมาชิก (User)</option>
                        <option value="admin">ผู้ดูแลระบบ (Admin)</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">เข้าสู่ระบบ</button>
            </form>

            <div class="demo-box">
                <strong>บัญชีทดลองสำหรับฝึกปฏิบัติ</strong><br>
                Admin: admin / admin123
            </div>
        </div>
    </main>

    <footer>
        <p>เที่ยวบ้านเรา | ใบงานฝึกปฏิบัติวิชาการสร้างเว็บไซต์ทางธุรกิจ</p>
    </footer>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-btn');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = 'ซ่อน';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = 'แสดง';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            alert('ยินดีต้อนรับคุณ ' + username + ' เข้าสู่ระบบเรียบร้อยแล้ว!');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
